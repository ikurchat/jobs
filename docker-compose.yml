services:
  jobs:
    build: .
    init: true                        # tini as PID 1 — reaps zombie processes
    env_file: .env
    environment:
      - TZ=${TZ:-Europe/Moscow}
      - HOME=/home/jobs
      - BROWSER_CDP_URL=http://browser:9223
      - BASEROW_URL=${BASEROW_URL}
      - BASEROW_TOKEN=${BASEROW_TOKEN}
      - CLAUDE_MODEL_LIGHT=${CLAUDE_MODEL_LIGHT:-claude-sonnet-4-5-20250929}
      - CLAUDE_MODEL_FAST=${CLAUDE_MODEL_FAST:-claude-haiku-4-5-20251001}
      - GMAIL_EMAIL=${GMAIL_EMAIL}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - NO_PROXY=osint,browser,localhost,127.0.0.1
      - no_proxy=osint,browser,localhost,127.0.0.1
    volumes:
      - ./data:/data              # Персистентные данные (сессия, БД)
      - ./data/.claude:/home/jobs/.claude  # Claude Code credentials
      - jobs-workspace:/workspace  # Рабочая директория Claude
      - ./skills:/workspace/.claude/skills  # Skills для SDK
      - browser-recordings:/recordings:ro  # Аудио-записи из браузера (read-only)
      - browser-control:/browser-control    # Управление браузером (proxy toggle)
    ports:
      - "127.0.0.1:8081:8080"    # Config API — localhost only (for Jobsy)
    restart: unless-stopped
    stdin_open: true              # Для интерактивного логина
    tty: true
    depends_on:
      browser:
        condition: service_healthy

  browser:
    build: ./browser
    environment:
      - TZ=${TZ:-Europe/Moscow}
      - RESOLUTION=1920x1080x24
      - HTTP_PROXY=${HTTP_PROXY:-}
      - VNC_PASSWORD=${VNC_PASSWORD:-}  # Set to enable VNC auth (empty = no password)
    volumes:
      - browser-profile:/home/browser/.config/chromium  # Персистентный профиль
      - browser-downloads:/home/browser/Downloads       # Скачанные файлы
      - browser-recordings:/recordings                  # Аудио-записи (10-мин чанки)
      - browser-control:/browser-control                # Управление из jobs (proxy toggle)
    ports:
      - "127.0.0.1:6080:6080"    # noVNC — localhost only (use SSH tunnel or reverse proxy)
      - "127.0.0.1:9223:9223"    # CDP — localhost only (containers use docker network)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9223/json"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  osint:
    build: ./osint-mcp
    init: true
    environment:
      - TZ=${TZ:-Europe/Moscow}
      - TG_API_ID=${TG_API_ID}
      - TG_API_HASH=${TG_API_HASH}
    volumes:
      - ./data/telethon.session:/data/telethon.session:ro
      - jobs-workspace:/workspace
    ports:
      - "127.0.0.1:8400:8400"    # localhost (host health checks)
      - "172.17.0.1:8400:8400"   # docker0 bridge (cross-compose via host.docker.internal)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8400/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  updater:
    build: ./updater
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}:${PWD}
    environment:
      - COMPOSE_DIR=${PWD}
    restart: unless-stopped

volumes:
  jobs-workspace:                 # Named volume для workspace
  browser-profile:                # Профиль Chromium (куки, сессии, история)
  browser-downloads:              # Скачанные файлы
  browser-recordings:             # Аудио-записи браузера (shared, 24ч retention)
  browser-control:               # Управление браузером (proxy toggle)
